[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datafixer"
version = "0.3.0"
description = "Chainable pandas cleaning utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
